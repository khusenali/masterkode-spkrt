name: Perbarui master SPKRT

on:
  push:
    paths:
      - "sumber/spkrt.db.gz"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-master
  cancel-in-progress: false

jobs:
  konversi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ubah database ke data app
        run: python tools/konversi_master.py sumber/spkrt.db.gz data

      - name: Commit kalau ada perubahan
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/master.json data/versi.json
          if git diff --cached --quiet; then
            echo "Tidak ada perubahan data."
            exit 0
          fi
          git commit -m "Perbarui master SPKRT dari pusat"
          git push
